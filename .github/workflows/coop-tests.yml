name: Co-op core tests
on:
  push:
    branches: [feature/co-op-foundation]
  pull_request:
    branches: [main]
jobs:
  multiplayer-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/multiplayer-core-test.cjs
      - run: node --check game/multiplayer-core.js
