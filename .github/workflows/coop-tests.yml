name: Co-op core tests
on:
  push:
    branches: [feature/co-op-foundation]
  pull_request:
    branches: [main]
jobs:
  multiplayer-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: node tests/multiplayer-core-test.cjs
      - run: node --check game/multiplayer-core.js
      - run: node --check game/multiplayer-client.js
      - run: node --check game/multiplayer-ui.js
      - run: python -m py_compile launcher.py
      - name: Smoke-test deployed co-op API
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://jaaguprbfrzrcwuusher.supabase.co/functions/v1/skyrealm-coop';
          const healthUrl = new URL(base);
          healthUrl.searchParams.set('route', '/health');
          const health = await fetch(healthUrl);
          const healthBody = await health.json();
          if (!health.ok || healthBody.status !== 'ok') {
            throw new Error('Co-op health check failed: ' + JSON.stringify(healthBody));
          }
          const protectedUrl = new URL(base);
          protectedUrl.searchParams.set('route', '/api/coop/current');
          const protectedResponse = await fetch(protectedUrl, {
            headers: { apikey: 'sb_publishable_MKaNYqw3r0BLa1GTDVvjfw_yU3Wd6QL' }
          });
          const protectedBody = await protectedResponse.json();
          if (protectedResponse.status !== 401 || protectedBody?.error?.code !== 'NO_SESSION') {
            throw new Error('Unauthenticated co-op request was not rejected as expected.');
          }
          console.log('Co-op health is OK; protected routes reject missing sessions.');
          NODE
