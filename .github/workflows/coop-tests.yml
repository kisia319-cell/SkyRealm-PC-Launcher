name: Co-op core tests
on:
  push:
    branches: [main, feature/co-op-foundation, feature/shared-enemies-and-loot, feature/profile-foundation-social-20261031, feature/coop-friend-invites-20261031, feature/launcher-foundations-remaining-20261031, 'fix/**']
  pull_request:
    branches: [main]
jobs:
  multiplayer-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: node tests/multiplayer-core-test.cjs
      - run: node tests/time-mechanics-test.cjs
      - run: node tests/intro-cleanup-test.cjs
      - run: node tests/sea-world-regression-test.cjs
      - run: node tests/boss-realm-regression-test.cjs
      - run: node tests/boss-realm-exploration-test.cjs
      - run: node --check game/boss-realm-hub.js
      - run: node tests/boss-realm-hub-test.cjs
      - run: node tests/world-events-expansion-test.cjs
      - run: node tests/multiplayer-client-test.cjs
      - run: node --check tests/staff-authorization-test.cjs
      - run: node --check tests/gameplay-regression-test.cjs
      - run: node --check tests/multiplayer-two-client-test.cjs
      - run: node tests/staff-authorization-test.cjs
      - run: node tests/gameplay-regression-test.cjs
      - run: node tests/mine-exploration-test.cjs
      - run: node tests/quarry-system-test.cjs
      - run: node tests/multiplayer-two-client-test.cjs
      - run: node tests/staff-api-smoke.mjs
      - run: node tests/supabase-migration-history-test.cjs
      - run: node tests/coop-ui-integration-test.cjs
      - run: node --check tests/prime-social-lobby-test.cjs
      - run: node tests/prime-social-lobby-test.cjs
      - run: node tests/profile-social-integration-test.cjs
      - run: node tests/profile-social-api-smoke.mjs
      - run: node --check game/competitive/prime-world.js
      - run: node tests/competitive-mode-test.cjs
      - run: node --check app.js
      - run: node tests/singleplayer-village-test.cjs
      - run: node --check game/world-expansion.js
      - run: node --check tests/village-building-test.cjs
      - run: node tests/village-building-test.cjs
      - run: node --check tests/village-watchtower-defense-test.cjs
      - run: node tests/village-watchtower-defense-test.cjs
      - run: node --check tests/village-frontier-test.cjs
      - run: node tests/village-frontier-test.cjs
      - run: node tests/expansion-systems-test.cjs
      - run: node tests/armor-set-test.cjs
      - run: node tests/game-smoke-test.cjs
      - run: node tests/performance-optimization-test.cjs
      - run: node tests/achievement-system-test.cjs
      - run: node tests/world-library-test.cjs
      - run: node tests/cosmetic-collection-test.cjs
      - run: node tests/adventure-history-test.cjs
      - run: node tests/mod-workshop-test.cjs
      # Full mechanics coverage: admin tools, staff privileges, economy, mods and careers.
      - run: node tests/admin-gear-regression-test.cjs
      - run: node tests/admin-time-item-regression-test.cjs
      - run: node tests/challenge-staff-regression-test.cjs
      - run: node tests/cloud-save-api-test.cjs
      - run: node tests/cloud-save-ui-test.cjs
      - run: node tests/custom-mod-runtime-test.cjs
      - run: node tests/farm-economy-test.cjs
      - run: node tests/launcher-enhancements-test.cjs
      - run: node tests/launcher-staff-admin-test.cjs
      - run: node tests/mod-studio-handoff-test.cjs
      - run: node tests/professions-system-test.cjs
      - run: node tests/auth-smoke.mjs
      - run: node --check game/multiplayer-core.js
      - run: node --check game/multiplayer-client.js
      - run: node --check game/multiplayer-ui.js
      - run: node --check game/game.js
      - run: node --check game/world-events.js
      - run: node --check game/sea-system.js
      - run: node --check game/expansion-systems.js
      - run: node --check game/boss-realm-exploration.js
      - run: python -m py_compile launcher.py
      - name: Smoke-test deployed co-op API
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://jaaguprbfrzrcwuusher.supabase.co/functions/v1/skyrealm-coop';
          const healthUrl = new URL(base);
          healthUrl.searchParams.set('route', '/health');
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function fetchJsonWithRetry(url, init = {}, label = 'request') {
            let lastError;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const response = await fetch(url, init);
                const raw = await response.text();
                let payload = null;
                if (raw) {
                  try { payload = JSON.parse(raw); }
                  catch { throw new Error(label + ' returned invalid JSON (HTTP ' + response.status + '): ' + raw.slice(0, 240)); }
                }
                if (response.status < 500 && payload !== null) return { response, payload };
                lastError = new Error(label + ' returned HTTP ' + response.status + ': ' + (raw || '<empty response>'));
              } catch (error) { lastError = error; }
              if (attempt < 4) await wait(attempt * 1500);
            }
            throw lastError || new Error(label + ' failed after retries');
          }
          const healthResult = await fetchJsonWithRetry(healthUrl, {}, 'Co-op health');
          if (!healthResult.response.ok || healthResult.payload?.status !== 'ok') {
            throw new Error('Co-op health check failed: ' + JSON.stringify(healthResult.payload));
          }
          async function assertProtected(route, method = 'GET', body) {
            const url = new URL(base);
            url.searchParams.set('route', route);
            const result = await fetchJsonWithRetry(url, {
              method,
              headers: {
                apikey: 'sb_publishable_MKaNYqw3r0BLa1GTDVvjfw_yU3Wd6QL',
                ...(body ? { 'Content-Type': 'application/json' } : {})
              },
              body: body ? JSON.stringify(body) : undefined
            }, 'Co-op protected route ' + route);
            const { response, payload } = result;
            if (response.status !== 401 || payload?.error?.code !== 'NO_SESSION') {
              throw new Error('Unauthenticated route was not rejected: ' + route + ' ' + JSON.stringify(payload));
            }
          }
          await assertProtected('/api/coop/current');
          await assertProtected('/api/coop/snapshot/get', 'POST', { room_id: '123e4567-e89b-12d3-a456-426614174000' });
          await assertProtected('/api/coop/claim', 'POST', { room_id: '123e4567-e89b-12d3-a456-426614174000', object_kind: 'treasure_chest', object_id: 'forest' });
          await assertProtected('/api/coop/snapshot/save', 'POST', {
            room_id: '123e4567-e89b-12d3-a456-426614174000',
            expected_version: 0,
            payload: { placedStructures: [] }
          });
          await assertProtected('/api/coop/actions/enqueue', 'POST', {
            room_id: '123e4567-e89b-12d3-a456-426614174000',
            action_id: '123e4567-e89b-42d3-a456-426614174099',
            action_type: 'farm_plant',
            payload: { x: 112, y: 144, crop_id: 'wheat' }
          });
          await assertProtected('/api/coop/actions/commit-farm', 'POST', {
            room_id: '123e4567-e89b-12d3-a456-426614174000',
            action_id: '123e4567-e89b-42d3-a456-426614174099',
            expected_version: 0,
            payload: { farmCrops: [] },
            result: { consumed_item: 'Семена пшеницы' }
          });
          await assertProtected('/api/coop/actions/enqueue', 'POST', {
            room_id: '123e4567-e89b-12d3-a456-426614174000',
            action_id: '123e4567-e89b-42d3-a456-426614174098',
            action_type: 'mine_rock',
            payload: { rock_index: 3, tool: 'Кирка' }
          });
          await assertProtected('/api/coop/actions/commit-mine', 'POST', {
            room_id: '123e4567-e89b-12d3-a456-426614174000',
            action_id: '123e4567-e89b-42d3-a456-426614174098',
            expected_version: 0,
            payload: { mineRocks: [] },
            result: {}
          });
          await assertProtected('/api/coop/actions/enqueue', 'POST', {
            room_id: '123e4567-e89b-12d3-a456-426614174000',
            action_id: '123e4567-e89b-42d3-a456-426614174097',
            action_type: 'chop_tree',
            payload: { x: 144, y: 177, tool: 'Топор' }
          });
          await assertProtected('/api/coop/actions/commit-tree', 'POST', {
            room_id: '123e4567-e89b-12d3-a456-426614174000',
            action_id: '123e4567-e89b-42d3-a456-426614174097',
            expected_version: 0,
            payload: { adventureQuestProgress: { treeChops: [], felledTrees: [] } },
            result: {}
          });
          await assertProtected('/api/coop/actions/commit-enemy', 'POST', {
            room_id: '123e4567-e89b-12d3-a456-426614174000',
            action_id: '123e4567-e89b-42d3-a456-426614174096',
            expected_version: 0,
            payload: { adventureQuestProgress: { coopMonsters: [] }, lootDrops: [] },
            result: {}
          });
          console.log('Co-op health is OK; current, snapshot, world-claim, farm, mining and tree routes reject missing sessions.');
          NODE
