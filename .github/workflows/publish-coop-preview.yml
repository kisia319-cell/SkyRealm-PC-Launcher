name: Publish co-op preview for launcher
on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/publish-coop-preview.yml"
permissions:
  contents: write
jobs:
  build-and-publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate game package
        run: |
          test "$(tr -d '\r\n' < game/version.txt)" = "0.20.10"
          test -f game/index.html
          test -f game/game.js
          node --check game/game.js
      - name: Build game archive and checksum
        id: package
        run: |
          cd game
          zip -r ../SkyRealm_Game.zip .
          cd ..
          HASH="$(sha256sum SkyRealm_Game.zip | cut -d ' ' -f 1)"
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "tag=singleplayer-village-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: SkyRealm 0.20.10 Update
          prerelease: true
          token: ${{ github.token }}
          generate_release_notes: true
          files: SkyRealm_Game.zip
      - name: Point launcher manifest to this verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GAME_SHA256: ${{ steps.package.outputs.sha256 }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          git fetch origin main
          git switch -C manifest-update origin/main
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["game_version"] = "0.20.10"
          manifest["game_download_url"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/SkyRealm_Game.zip"
          manifest["game_sha256"] = os.environ["GAME_SHA256"]
          manifest["notes"] = "SkyRealm 0.20.10: nine houses in each of five villages, faster ordinary residents in single-player and Trade World. Existing worlds and saves remain compatible. Co-op remains a preview."
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Publish SkyRealm 0.20.8 co-op preview manifest"
          git push origin HEAD:main
