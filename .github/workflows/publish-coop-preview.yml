name: Publish co-op preview for launcher
on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/publish-coop-preview.yml"
permissions:
  contents: write

concurrency:
  group: skyrealm-coop-preview-publish
  cancel-in-progress: false

jobs:
  build-and-publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate game package
        id: validate
        run: |
          VERSION="$(tr -d '\r\n' < game/version.txt)"
          test -n "$VERSION"
          node -e "const fs=require('node:fs'); const v=fs.readFileSync('game/version.txt','utf8').trim(); const h=fs.readFileSync('game/index.html','utf8'); if(!/^\\d+\\.\\d+\\.\\d+$/.test(v)) process.exit(1); if(!h.includes('content=\"'+v+'\"') || !h.includes('2D SURVIVAL · '+v)) process.exit(1);"
          test -f game/index.html
          test -f game/game.js
          node --check game/game.js
          echo "game_version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build game archive and checksum
        id: package
        run: |
          cd game
          zip -r ../SkyRealm_Game.zip .
          cd ..
          HASH="$(sha256sum SkyRealm_Game.zip | cut -d ' ' -f 1)"
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "tag=coop-preview-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "game_version=$(tr -d '\r\n' < game/version.txt)" >> "$GITHUB_OUTPUT"
      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: SkyRealm ${{ steps.package.outputs.game_version }} Preview
          prerelease: true
          token: ${{ github.token }}
          generate_release_notes: true
          files: SkyRealm_Game.zip
      - name: Point launcher manifest to this verified package
        env:
          GAME_SHA256: ${{ steps.package.outputs.sha256 }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          GAME_VERSION: ${{ steps.package.outputs.game_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git switch -C manifest-update origin/main
            python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          version = os.environ["GAME_VERSION"]
          manifest["game_version"] = version
          manifest["game_download_url"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/SkyRealm_Game.zip"
          manifest["game_sha256"] = os.environ["GAME_SHA256"]
          manifest["notes"] = f"SkyRealm {version}: random world events with distinct odds (meteor 12%, night horde 7%, abandoned camp 10%, traveler 8%, storm 8%); 18 varied houses in each village; saved event cooldowns and backward-compatible world saves. Co-op remains a preview."
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            git add manifest.json
            if git diff --cached --quiet; then
              echo "Manifest already points to this verified package."
              pushed=true
              break
            fi
            git commit -m "Publish SkyRealm $GAME_VERSION preview manifest"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Manifest push raced with another workflow; refreshing main (attempt $attempt/5)."
            sleep $((attempt * 5))
          done
          if [ "$pushed" != true ]; then
            echo "Could not update manifest after 5 attempts." >&2
            exit 1
          fi
