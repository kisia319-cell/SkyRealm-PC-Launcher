name: Build and publish PrimeLauncher only

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prime-launcher-only.yml"
      - "game/competitive/index.html"
      - "game/competitive/prime-world.js"
      - "game/competitive/prime-online.js"
      - "prime_launcher.py"
      - "prime_launcher_version.txt"
      - "tests/prime-online-test.cjs"
      - "tests/prime-battle-systems-test.cjs"
      - "tests/competitive-mode-test.cjs"
      - "tests/prime-mine-regression-test.cjs"
      - "tests/prime-updater-test.py"

permissions:
  contents: write

concurrency:
  group: prime-launcher-windows-build-v1
  cancel-in-progress: true

jobs:
  build-prime:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Validate PrimeLauncher sources
        shell: pwsh
        run: |
          $required = @(
            "launcher.py",
            "prime_launcher.py",
            "prime_launcher_version.txt",
            "PrimeLauncher.ico",
            "requirements-build.txt",
            "game/competitive/index.html",
            "game/competitive/prime-world.js",
            "game/competitive/prime-online.js"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw ("Missing PrimeLauncher files: " + ($missing -join ", ")) }
          python -m py_compile launcher.py prime_launcher.py
          python tests/prime-updater-test.py
          node --check game/competitive/prime-world.js
          node --check game/competitive/prime-online.js
          node --check tests/competitive-mode-test.cjs
          node tests/competitive-mode-test.cjs
          node --check tests/prime-online-test.cjs
          node tests/prime-online-test.cjs
          node --check tests/prime-battle-systems-test.cjs
          node tests/prime-battle-systems-test.cjs
          node --check tests/prime-mine-regression-test.cjs
          node tests/prime-mine-regression-test.cjs

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build standalone PrimeLauncher
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --noupx --name PrimeLauncher --icon "${PWD}/PrimeLauncher.ico" --distpath prime_launcher_dist --workpath build_prime_launcher/work --specpath build_prime_launcher --add-data "${PWD}/game/competitive;game/competitive" --add-data "${PWD}/prime_launcher_version.txt;." prime_launcher.py

      - name: Build standalone PrimeLauncher portable folder
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --noupx --name PrimeLauncher --icon "${PWD}/PrimeLauncher.ico" --distpath prime_launcher_portable_dist --workpath build_prime_launcher_portable/work --specpath build_prime_launcher_portable --add-data "${PWD}/game/competitive;game/competitive" --add-data "${PWD}/prime_launcher_version.txt;." prime_launcher.py

      - name: Verify standalone package
        shell: pwsh
        run: |
          $exe = "prime_launcher_dist/PrimeLauncher.exe"
          if (-not (Test-Path $exe)) { throw "PrimeLauncher.exe was not produced" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "PrimeLauncher.exe is unexpectedly small" }
          $listing = python -m PyInstaller.utils.cliutils.archive_viewer -l -b $exe 2>&1 | Out-String
          $normalized = $listing.ToLower().Replace("\", "/")
          foreach ($asset in @("game/competitive/index.html", "game/competitive/prime-world.js", "game/competitive/prime-online.js")) {
            if (-not $normalized.Contains($asset)) { throw "PrimeLauncher is missing bundled asset: $asset" }
          }

      - name: Verify portable folder distribution
        shell: pwsh
        run: |
          $portableRoot = "prime_launcher_portable_dist/PrimeLauncher"
          $portableExe = Join-Path $portableRoot "PrimeLauncher.exe"
          if (-not (Test-Path $portableExe)) { throw "Portable PrimeLauncher.exe is missing" }
          foreach ($asset in @("index.html", "prime-world.js", "prime-online.js")) {
            if (-not (Get-ChildItem -Path $portableRoot -Recurse -File -Filter $asset -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Portable PrimeLauncher is missing $asset"
            }
          }

      - name: Sign PrimeLauncher binaries when a trusted certificate is configured
        shell: pwsh
        env:
          PRIME_SIGNING_PFX_BASE64: ${{ secrets.PRIME_SIGNING_PFX_BASE64 }}
          PRIME_SIGNING_PFX_PASSWORD: ${{ secrets.PRIME_SIGNING_PFX_PASSWORD }}
        run: |
          $targets = @(
            "prime_launcher_dist/PrimeLauncher.exe",
            "prime_launcher_portable_dist/PrimeLauncher/PrimeLauncher.exe"
          )
          if ([string]::IsNullOrWhiteSpace($env:PRIME_SIGNING_PFX_BASE64) -and [string]::IsNullOrWhiteSpace($env:PRIME_SIGNING_PFX_PASSWORD)) {
            "UNSIGNED: no trusted Authenticode certificate is configured for this repository." | Set-Content -Path "prime_launcher_dist/PrimeLauncher-SIGNATURE.txt" -Encoding UTF8
            Write-Warning "PrimeLauncher artifacts remain unsigned. Add PRIME_SIGNING_PFX_BASE64 and PRIME_SIGNING_PFX_PASSWORD repository secrets to enable trusted signing."
          } elseif ([string]::IsNullOrWhiteSpace($env:PRIME_SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:PRIME_SIGNING_PFX_PASSWORD)) {
            throw "Both PRIME_SIGNING_PFX_BASE64 and PRIME_SIGNING_PFX_PASSWORD must be configured together."
          } else {
            $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            $signTool = Get-ChildItem -Path $sdk -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw "Windows SDK SignTool was not found." }
            $pfx = Join-Path $env:RUNNER_TEMP "PrimeLauncher-CodeSigning.pfx"
            try {
              [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PRIME_SIGNING_PFX_BASE64))
              foreach ($exe in $targets) {
                & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:PRIME_SIGNING_PFX_PASSWORD $exe
                if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $exe." }
                $signature = Get-AuthenticodeSignature -FilePath $exe
                if ($signature.Status -ne "Valid") { throw "Authenticode signature is not valid for ${exe}: $($signature.Status)." }
              }
              $subject = (Get-AuthenticodeSignature -FilePath $targets[0]).SignerCertificate.Subject
              "SIGNED: Authenticode SHA-256 timestamped signature. Publisher: $subject" | Set-Content -Path "prime_launcher_dist/PrimeLauncher-SIGNATURE.txt" -Encoding UTF8
            } finally {
              if (Test-Path $pfx) { Remove-Item $pfx -Force }
            }
          }

      - name: Package executable ZIP
        shell: pwsh
        run: |
          $package = "prime_launcher_package"
          $version = (Get-Content prime_launcher_version.txt -Raw).Trim()
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "prime_launcher_dist/PrimeLauncher.exe" "$package/PrimeLauncher.exe" -Force
          Copy-Item "prime_launcher_dist/PrimeLauncher-SIGNATURE.txt" "$package/PrimeLauncher-SIGNATURE.txt" -Force
          @"
          PrimeLauncher $version

          Распакуй архив полностью и запусти PrimeLauncher.exe.
          Это отдельный соревновательный режим SkyRealm.
          Обычный SkyRealm.exe и файлы обычной игры этим архивом не изменяются.
          "@ | Set-Content -Path "$package/README.txt" -Encoding UTF8
          Compress-Archive -Path "$package/*" -DestinationPath "prime_launcher_dist/PrimeLauncher-Windows.zip" -Force
          if (-not (Test-Path "prime_launcher_dist/PrimeLauncher-Windows.zip")) { throw "PrimeLauncher ZIP package was not created" }
          @"
          PrimeLauncher $version portable folder build

          Распакуй весь архив в отдельную папку и запускай PrimeLauncher.exe внутри неё.
          Не перемещай EXE отдельно от папки _internal.
          "@ | Set-Content -Path "prime_launcher_portable_dist/PrimeLauncher/README.txt" -Encoding UTF8
          Compress-Archive -Path "prime_launcher_portable_dist/PrimeLauncher/*" -DestinationPath "prime_launcher_dist/PrimeLauncher-Portable.zip" -Force
          $zipHash = (Get-FileHash "prime_launcher_dist/PrimeLauncher-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$zipHash  PrimeLauncher-Windows.zip" | Set-Content -Path "prime_launcher_dist/PrimeLauncher-Windows.zip.sha256" -Encoding ASCII -NoNewline
          $exeHash = (Get-FileHash "prime_launcher_dist/PrimeLauncher.exe" -Algorithm SHA256).Hash.ToLower()
          "$exeHash  PrimeLauncher.exe" | Set-Content -Path "prime_launcher_dist/PrimeLauncher.exe.sha256" -Encoding ASCII -NoNewline
          $portableHash = (Get-FileHash "prime_launcher_dist/PrimeLauncher-Portable.zip" -Algorithm SHA256).Hash.ToLower()
          "$portableHash  PrimeLauncher-Portable.zip" | Set-Content -Path "prime_launcher_dist/PrimeLauncher-Portable.zip.sha256" -Encoding ASCII -NoNewline

      - name: Upload standalone executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeLauncher-Windows
          path: |
            prime_launcher_dist/PrimeLauncher.exe
            prime_launcher_dist/PrimeLauncher-Windows.zip
            prime_launcher_dist/PrimeLauncher-Windows.zip.sha256
            prime_launcher_dist/PrimeLauncher-Portable.zip
            prime_launcher_dist/PrimeLauncher-Portable.zip.sha256
            prime_launcher_dist/PrimeLauncher.exe.sha256
            prime_launcher_dist/PrimeLauncher-SIGNATURE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish standalone PrimeLauncher release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content prime_launcher_version.txt -Raw).Trim()
          $tag = "prime-v$version-reg${{ github.run_number }}"
          $notes = @"
          Отдельная сборка PrimeLauncher для Windows.
          
          Содержит исправление локального игрока на Android/Windows, корректное отображение HP и базы гостя, сохранение кэша карты между сетевыми пакетами, более частую синхронизацию и сглаженный RTT-пинг.
          
          PrimeLauncher.exe сразу открывает соревновательный мир. Он собран с отдельной точкой входа и не запускает обычное окно SkyRealm. Обычный SkyRealm.exe и игровой архив SkyRealm этой публикацией не пересобираются. Android APK собирается и публикуется в отдельном мобильном репозитории.

          Дополнительно приложен PrimeLauncher-Portable.zip (onedir): запускай EXE из распакованной папки вместе с файлами рядом. В релизе есть SHA-256 для EXE и архивов, а PrimeLauncher-SIGNATURE.txt сообщает реальный статус Authenticode. Без настроенного доверенного сертификата сборка остаётся неподписанной; портативная упаковка не гарантирует отсутствие антивирусных срабатываний.
          "@
          gh release create $tag "prime_launcher_dist/PrimeLauncher.exe" "prime_launcher_dist/PrimeLauncher-Windows.zip" "prime_launcher_dist/PrimeLauncher-Windows.zip.sha256" "prime_launcher_dist/PrimeLauncher-Portable.zip" "prime_launcher_dist/PrimeLauncher-Portable.zip.sha256" "prime_launcher_dist/PrimeLauncher.exe.sha256" "prime_launcher_dist/PrimeLauncher-SIGNATURE.txt" --title "PrimeLauncher $version (standalone)" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Could not publish standalone PrimeLauncher release" }
          $release = gh release view $tag --json assets,url | ConvertFrom-Json
          if (-not ($release.assets | Where-Object { $_.name -eq "PrimeLauncher.exe" })) {
            throw "PrimeLauncher.exe is missing from the published release"
          }
          if (-not ($release.assets | Where-Object { $_.name -eq "PrimeLauncher-Windows.zip" })) {
            throw "PrimeLauncher-Windows.zip is missing from the published release"
          }
          if (-not ($release.assets | Where-Object { $_.name -eq "PrimeLauncher-Portable.zip" })) {
            throw "PrimeLauncher-Portable.zip is missing from the published release"
          }
          foreach ($assetName in @("PrimeLauncher.exe.sha256", "PrimeLauncher-Portable.zip.sha256", "PrimeLauncher-SIGNATURE.txt")) {
            if (-not ($release.assets | Where-Object { $_.name -eq $assetName })) { throw "$assetName is missing from the published release" }
          }
          Write-Host "Published standalone PrimeLauncher: $($release.url)"
