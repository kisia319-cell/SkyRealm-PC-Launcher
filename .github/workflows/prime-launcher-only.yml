name: Build and publish PrimeLauncher only

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prime-launcher-only.yml"
      - "game/competitive/index.html"
      - "game/competitive/prime-world.js"
      - "game/competitive/prime-online.js"
      - "prime_launcher_version.txt"

permissions:
  contents: write

concurrency:
  group: prime-launcher-windows-build-v1
  cancel-in-progress: true

jobs:
  build-prime:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Validate PrimeLauncher sources
        shell: pwsh
        run: |
          $required = @(
            "launcher.py",
            "prime_launcher.py",
            "PrimeLauncher.ico",
            "requirements-build.txt",
            "game/competitive/index.html",
            "game/competitive/prime-world.js",
            "game/competitive/prime-online.js"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw ("Missing PrimeLauncher files: " + ($missing -join ", ")) }
          python -m py_compile launcher.py prime_launcher.py
          node --check game/competitive/prime-world.js
          node --check game/competitive/prime-online.js
          node --check tests/competitive-mode-test.cjs
          node tests/competitive-mode-test.cjs
          node --check tests/prime-online-test.cjs
          node tests/prime-online-test.cjs

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build standalone PrimeLauncher
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --noupx --name PrimeLauncher --icon "${PWD}/PrimeLauncher.ico" --distpath prime_launcher_dist --workpath build_prime_launcher/work --specpath build_prime_launcher --add-data "${PWD}/game/competitive;game/competitive" prime_launcher.py

      - name: Verify standalone package
        shell: pwsh
        run: |
          $exe = "prime_launcher_dist/PrimeLauncher.exe"
          if (-not (Test-Path $exe)) { throw "PrimeLauncher.exe was not produced" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "PrimeLauncher.exe is unexpectedly small" }
          $listing = python -m PyInstaller.utils.cliutils.archive_viewer -l -b $exe 2>&1 | Out-String
          $normalized = $listing.ToLower().Replace("\", "/")
          foreach ($asset in @("game/competitive/index.html", "game/competitive/prime-world.js", "game/competitive/prime-online.js")) {
            if (-not $normalized.Contains($asset)) { throw "PrimeLauncher is missing bundled asset: $asset" }
          }

      - name: Package executable ZIP
        shell: pwsh
        run: |
          $package = "prime_launcher_package"
          $version = (Get-Content prime_launcher_version.txt -Raw).Trim()
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "prime_launcher_dist/PrimeLauncher.exe" "$package/PrimeLauncher.exe" -Force
          @"
          PrimeLauncher $version

          Распакуй архив полностью и запусти PrimeLauncher.exe.
          Это отдельный соревновательный режим SkyRealm.
          Обычный SkyRealm.exe и файлы обычной игры этим архивом не изменяются.
          "@ | Set-Content -Path "$package/README.txt" -Encoding UTF8
          Compress-Archive -Path "$package/*" -DestinationPath "prime_launcher_dist/PrimeLauncher-Windows.zip" -Force
          if (-not (Test-Path "prime_launcher_dist/PrimeLauncher-Windows.zip")) { throw "PrimeLauncher ZIP package was not created" }

      - name: Upload standalone executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeLauncher-Windows
          path: |
            prime_launcher_dist/PrimeLauncher.exe
            prime_launcher_dist/PrimeLauncher-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish standalone PrimeLauncher release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content prime_launcher_version.txt -Raw).Trim()
          $tag = "prime-v$version-reg${{ github.run_number }}"
          $notes = @"
          Отдельная сборка PrimeLauncher для Windows.
          
          Содержит исправление локального игрока на Android/Windows, корректное отображение HP и базы гостя, сохранение кэша карты между сетевыми пакетами, более частую синхронизацию и сглаженный RTT-пинг.
          
          PrimeLauncher.exe сразу открывает соревновательный мир. Он собран с отдельной точкой входа и не запускает обычное окно SkyRealm. Обычный SkyRealm.exe и игровой архив SkyRealm этой публикацией не пересобираются. Android APK собирается и публикуется в отдельном мобильном репозитории.
          "@
          gh release create $tag "prime_launcher_dist/PrimeLauncher.exe" "prime_launcher_dist/PrimeLauncher-Windows.zip" --title "PrimeLauncher $version (standalone)" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Could not publish standalone PrimeLauncher release" }
          $release = gh release view $tag --json assets,url | ConvertFrom-Json
          if (-not ($release.assets | Where-Object { $_.name -eq "PrimeLauncher.exe" })) {
            throw "PrimeLauncher.exe is missing from the published release"
          }
          if (-not ($release.assets | Where-Object { $_.name -eq "PrimeLauncher-Windows.zip" })) {
            throw "PrimeLauncher-Windows.zip is missing from the published release"
          }
          Write-Host "Published standalone PrimeLauncher: $($release.url)"
