name: Build and publish PrimeLauncher Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/prime-launcher-android/**"
      - "game/competitive/index.html"
      - "game/competitive/prime-world.js"
      - "game/competitive/prime-online.js"
      - ".github/workflows/prime-launcher-android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/prime-launcher-android/**"
      - "game/competitive/index.html"
      - "game/competitive/prime-world.js"
      - "game/competitive/prime-online.js"
      - ".github/workflows/prime-launcher-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify bundled PrimeLauncher assets match Windows source
        run: python3 tests/prime-android-assets-test.py

      - name: Verify Android updater configuration
        run: python3 tests/prime-android-updater-test.py

      - name: Build APK (stable release signature when configured)
        id: build
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile/prime-launcher-android
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            gradle --no-daemon :app:assembleRelease
            APK="app/build/outputs/apk/release/app-release.apk"
            ASSET_NAME="app-release.apk"
            SIGNING="stable"
          else
            echo "::warning::Android signing secrets are not configured; building a debug APK. Debug APKs from separate CI runners are not guaranteed to update each other in place."
            gradle --no-daemon :app:assembleDebug
            APK="app/build/outputs/apk/debug/app-debug.apk"
            ASSET_NAME="app-debug.apk"
            SIGNING="debug"
          fi
          test -s "$APK"
          echo "apk_path=mobile/prime-launcher-android/$APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "signing=$SIGNING" >> "$GITHUB_OUTPUT"

      - name: Verify APK contents
        env:
          APK_PATH: ${{ steps.build.outputs.apk_path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path(os.environ["APK_PATH"])
          if not apk.is_file() or apk.stat().st_size < 1_000_000:
              raise SystemExit("Android APK is missing or unexpectedly small")
          with ZipFile(apk) as archive:
              names = set(archive.namelist())
              required = {
                  "assets/prime/index.html",
                  "assets/prime/prime-world.js",
                  "assets/prime/prime-online.js",
                  "classes.dex",
                  "res/xml/file_paths.xml",
              }
              missing = required - names
              if missing:
                  raise SystemExit("APK missing: " + ", ".join(sorted(missing)))
          print(f"Verified {apk} ({apk.stat().st_size} bytes)")
          PY

      - name: Read Android release version
        id: version
        shell: bash
        run: |
          VERSION="$(cat mobile/prime-launcher-android/version.txt | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prime-android-v${{ steps.version.outputs.version }}
          name: PrimeLauncher Android ${{ steps.version.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          draft: false
          prerelease: true
          files: ${{ steps.build.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeLauncher-Android-${{ steps.version.outputs.version }}-${{ steps.build.outputs.signing }}
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
