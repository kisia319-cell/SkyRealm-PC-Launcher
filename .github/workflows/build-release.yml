name: Build SkyRealm Windows Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required source files
        shell: pwsh
        run: |
          $required = @(
            "launcher.py", "update_helper.py", "launcher_version.txt",
            "game_runner_version.txt", "updater_config.json", "index.html",
            "style.css", "app.js", "config.js", "realm.jpg", "icon.png",
            "SkyRealm.ico", "game/index.html", "game/game.js"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ("Missing project files: " + ($missing -join ", "))
          }

      - name: Install build tools
        run: python -m pip install --upgrade pip pywebview pyinstaller

      - name: Build game window executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name SkyRealmGame --distpath game_runner_dist --workpath build_game_runner/work --specpath build_game_runner launcher.py

      - name: Build updater helper
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name SkyRealmUpdater --distpath updater_dist --workpath build_updater/work --specpath build_updater update_helper.py

      - name: Build launcher executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name SkyRealm --icon SkyRealm.ico --add-data "index.html;." --add-data "style.css;." --add-data "app.js;." --add-data "config.js;." --add-data "realm.jpg;." --add-data "icon.png;." --add-data "game;game" --add-data "game_runner_version.txt;." --add-data "launcher_version.txt;." --add-data "updater_config.json;." --add-data "game_runner_dist/SkyRealmGame.exe;bin" --add-data "updater_dist/SkyRealmUpdater.exe;bin" launcher.py
          if (-not (Test-Path "dist/SkyRealm.exe")) { throw "SkyRealm.exe was not created" }

      - name: Prepare update archive and manifest
        shell: pwsh
        run: |
          $version = (Get-Content launcher_version.txt -Raw).Trim()
          if (-not $version) { throw "launcher_version.txt is empty" }
          New-Item -ItemType Directory -Force update_release | Out-Null
          Compress-Archive -Path "dist/SkyRealm.exe","launcher_version.txt" -DestinationPath "update_release/SkyRealm_Update.zip" -Force
          $hash = (Get-FileHash "update_release/SkyRealm_Update.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            version = $version
            download_url = "https://github.com/kisia319-cell/SkyRealm-PC-Launcher/releases/latest/download/SkyRealm_Update.zip"
            sha256 = $hash
            notes = "SkyRealm Launcher $version"
          } | ConvertTo-Json
          Set-Content -Path update_release/manifest.json -Value $manifest -Encoding utf8
          Copy-Item update_release/manifest.json manifest.json -Force

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "main" -or $tag -eq "") { $tag = "v" + (Get-Content launcher_version.txt -Raw).Trim() }
          gh release create $tag update_release/SkyRealm_Update.zip update_release/manifest.json --title "SkyRealm Launcher $((Get-Content launcher_version.txt -Raw).Trim())" --notes "Автоматическая сборка SkyRealm Launcher для Windows." --latest

      - name: Commit updated manifest
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item update_release/manifest.json manifest.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update release manifest" || Write-Host "Manifest unchanged"
          git push origin main
