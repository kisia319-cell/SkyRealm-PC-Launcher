name: Build SkyRealm Windows Launcher

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "manifest.json"
      - "preview-manifest.json"
      - ".github/workflows/coop-tests.yml"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skyrealm-windows-build-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Check required source files
        shell: pwsh
        run: |
          $required = @(
            "launcher.py", "update_helper.py", "launcher_version.txt",
            "game_runner_version.txt", "updater_config.json", "index.html",
            "style.css", "app.js", "launcher-enhancements.css", "launcher-enhancements.js", "community-mods.css", "community-mods.js", "config.js", "realm.jpg", "icon.png",
            "SkyRealm.ico", "game/competitive/index.html", "game/competitive/prime-world.js", "tests/competitive-mode-test.cjs", "game/index.html", "game/game.js", "game/version.txt", "game/bugfix_counter.txt",
            "game/edition-system.js", "game/forest-ecosystem.js", "game/world-events.js", "game/world-expansion.js", "game/multiplayer-core.js", "game/multiplayer-client.js", "game/multiplayer-ui.js", "game/sea-system.js", "game/living-world.js", "game/cloud-save-ui.js", "game/custom-mods-runtime.js", "game/custom-mods.css", "game/expansion-systems.js"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ("Missing project files: " + ($missing -join ", "))
          }
          python -m py_compile launcher.py update_helper.py
          node --check game/game.js
          node --check game/edition-system.js
          node --check game/forest-ecosystem.js
          node --check game/world-events.js
          node --check game/world-expansion.js
          node --check game/multiplayer-core.js
          node --check game/multiplayer-client.js
          node --check game/multiplayer-ui.js
          node --check game/sea-system.js
          node --check game/living-world.js
          node --check game/challenge-mode.js
          node --check tests/sea-world-regression-test.cjs
          node --check tests/challenge-staff-regression-test.cjs
          node --check game/competitive/prime-world.js
          node tests/competitive-mode-test.cjs
          node --check app.js
          node --check launcher-enhancements.js
          node --check community-mods.js
          node --check game/cloud-save-ui.js
          node --check game/custom-mods-runtime.js
          node --check game/expansion-systems.js
          node --check tests/expansion-systems-test.cjs
          node --check tests/professions-system-test.cjs
          node --check tests/armor-set-test.cjs
          node --check tests/auth-smoke.mjs
          node --check tests/game-smoke-test.cjs
          node --check tests/farm-economy-test.cjs
          node --check tests/singleplayer-village-test.cjs
          node --check tests/multiplayer-core-test.cjs
          node --check tests/multiplayer-client-test.cjs
          node --check tests/coop-ui-integration-test.cjs
          node --check tests/supabase-migration-history-test.cjs
          node --check tests/time-mechanics-test.cjs
          node tests/game-smoke-test.cjs
          node tests/performance-optimization-test.cjs
          node tests/achievement-system-test.cjs
          node tests/world-library-test.cjs
          node tests/cosmetic-collection-test.cjs
          node tests/adventure-history-test.cjs
          node tests/mod-workshop-test.cjs
          node tests/custom-mod-runtime-test.cjs
          node tests/mod-studio-handoff-test.cjs
          node tests/farm-economy-test.cjs
          node tests/singleplayer-village-test.cjs
          node tests/multiplayer-core-test.cjs
          node tests/multiplayer-client-test.cjs
          node tests/coop-ui-integration-test.cjs
          node tests/auth-smoke.mjs
          node tests/launcher-enhancements-test.cjs
          node tests/cloud-save-ui-test.cjs
          node tests/cloud-save-api-test.cjs
          node tests/supabase-migration-history-test.cjs
          node tests/time-mechanics-test.cjs
          node tests/gameplay-regression-test.cjs
          node tests/world-events-expansion-test.cjs
          node --check tests/settlement-archipelago-regression-test.cjs
          node --check tests/boss-realm-regression-test.cjs
          node --check tests/world-expansion-regression-test.cjs
          node --check tests/release-manifest-channel-test.cjs
          node tests/release-manifest-channel-test.cjs
          node tests/boss-realm-regression-test.cjs
          node tests/world-expansion-regression-test.cjs
          node --check tests/world-event-save-test.cjs
          node tests/world-event-save-test.cjs
          node --check tests/village-assault-test.cjs
          node tests/village-assault-test.cjs
          node --check tests/settlement-relations-test.cjs
          node tests/settlement-relations-test.cjs
          node --check tests/settlement-guard-ai-test.cjs
          node tests/settlement-guard-ai-test.cjs
          node --check tests/village-guardian-test.cjs
          node tests/village-guardian-test.cjs
          node --check tests/village-building-test.cjs
          node tests/village-building-test.cjs
          node --check tests/village-watchtower-defense-test.cjs
          node tests/village-watchtower-defense-test.cjs
          node --check tests/village-frontier-test.cjs
          node tests/village-frontier-test.cjs
          node --check tests/quarry-system-test.cjs
          node tests/quarry-system-test.cjs
          node --check tests/mine-exploration-test.cjs
          node tests/mine-exploration-test.cjs
          node tests/sea-world-regression-test.cjs
          node tests/settlement-archipelago-regression-test.cjs
          node tests/challenge-staff-regression-test.cjs
          node tests/expansion-systems-test.cjs
          node tests/professions-system-test.cjs
          node tests/armor-set-test.cjs

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Record exact build dependency inventory
        run: python -m pip freeze | Out-File -FilePath build-dependencies.txt -Encoding utf8

      - name: Build game window executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --noupx --name SkyRealmGame --distpath game_runner_dist --workpath build_game_runner/work --specpath build_game_runner launcher.py

      - name: Build isolated PrimeLauncher runtime
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --noupx --name PrimeLauncher --distpath prime_launcher_dist --workpath build_prime_launcher/work --specpath build_prime_launcher launcher.py

      - name: Build updater helper
        run: python -m PyInstaller --noconfirm --clean --onefile --console --noupx --name SkyRealmUpdater --distpath updater_dist --workpath build_updater/work --specpath build_updater update_helper.py

      - name: Build launcher executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --noupx --name SkyRealm --icon SkyRealm.ico --add-data "index.html;." --add-data "style.css;." --add-data "app.js;." --add-data "launcher-enhancements.css;." --add-data "launcher-enhancements.js;." --add-data "community-mods.css;." --add-data "community-mods.js;." --add-data "config.js;." --add-data "realm.jpg;." --add-data "icon.png;." --add-data "game;game" --add-data "game_runner_version.txt;." --add-data "launcher_version.txt;." --add-data "updater_config.json;." --add-data "game_runner_dist/SkyRealmGame.exe;bin" --add-data "prime_launcher_dist/PrimeLauncher.exe;bin" --add-data "updater_dist/SkyRealmUpdater.exe;bin" --add-data "THIRD_PARTY_NOTICES.txt;." --add-data "ASSET_AND_LICENSE_REGISTER.md;." launcher.py
          if (-not (Test-Path "dist/SkyRealm.exe")) { throw "SkyRealm.exe was not created" }

      - name: Prepare update archives and manifest
        shell: pwsh
        run: |
          $version = (Get-Content launcher_version.txt -Raw).Trim()
          if (-not $version) { throw "launcher_version.txt is empty" }
          # Exclude this release's own tag when rebuilding the same version.
          $tags = @(git tag --list "v*" --sort=-version:refname)
          $currentTag = "v$version"
          $baseTag = $tags | Where-Object { $_ -ne $currentTag } | Select-Object -First 1
          $changedFiles = 0
          $changedLines = 0
          if ($baseTag) {
            $stats = @(git diff --numstat "$baseTag..HEAD")
            foreach ($line in $stats) {
              $parts = $line -split "`t"
              if ($parts.Count -ge 2) {
                $changedFiles++
                if ($parts[0] -ne "-") { $changedLines += [int]$parts[0] }
                if ($parts[1] -ne "-") { $changedLines += [int]$parts[1] }
              }
            }
          }
          if ($changedFiles -le 2 -and $changedLines -le 80) { $updateCategory = "Исправление" }
          elseif ($changedFiles -le 5 -and $changedLines -le 180) { $updateCategory = "Небольшое" }
          elseif ($changedLines -le 700) { $updateCategory = "Среднее" }
          elseif ($changedLines -le 2000) { $updateCategory = "Крупное" }
          else { $updateCategory = "Глобальное" }
          Write-Host "Automatic update category: $updateCategory ($changedFiles files, $changedLines lines)"
          New-Item -ItemType Directory -Force update_release | Out-Null

          # The updater consumes this small manifest+EXE archive.
          Compress-Archive -Path "dist/SkyRealm.exe","launcher_version.txt" -DestinationPath "update_release/SkyRealm_Update.zip" -Force
          $hash = (Get-FileHash "update_release/SkyRealm_Update.zip" -Algorithm SHA256).Hash.ToLowerInvariant()

          # Publish both a directly downloadable executable and a convenient portable ZIP.
          Copy-Item "dist/SkyRealm.exe" "update_release/SkyRealm.exe" -Force
          Copy-Item "launcher_version.txt" "update_release/launcher_version.txt" -Force
          Copy-Item "README.md" "update_release/README.txt" -Force
          Copy-Item "THIRD_PARTY_NOTICES.txt" "update_release/THIRD_PARTY_NOTICES.txt" -Force
          Copy-Item "ASSET_AND_LICENSE_REGISTER.md" "update_release/ASSET_AND_LICENSE_REGISTER.md" -Force
          Copy-Item "requirements-build.txt" "update_release/requirements-build.txt" -Force
          Copy-Item "build-dependencies.txt" "update_release/build-dependencies.txt" -Force
          Compress-Archive -Path "update_release/SkyRealm.exe","update_release/launcher_version.txt","update_release/README.txt","update_release/THIRD_PARTY_NOTICES.txt","update_release/ASSET_AND_LICENSE_REGISTER.md","update_release/requirements-build.txt","update_release/build-dependencies.txt" -DestinationPath "update_release/SkyRealm_Windows.zip" -Force

          Copy-Item "ASSET_AND_LICENSE_REGISTER.md" "game/ASSET_AND_LICENSE_REGISTER.md" -Force
          Copy-Item "THIRD_PARTY_NOTICES.txt" "game/THIRD_PARTY_NOTICES.txt" -Force
          $gameVersion = (Get-Content "game/version.txt" -Raw).Trim()
          if (-not $gameVersion) { throw "game/version.txt is empty" }
          Compress-Archive -Path "game\\*" -DestinationPath "update_release/SkyRealm_Game.zip" -Force
          $gameHash = (Get-FileHash "update_release/SkyRealm_Game.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{
            category = $updateCategory
            version = $version
            download_url = "https://github.com/kisia319-cell/SkyRealm-PC-Launcher/releases/latest/download/SkyRealm_Update.zip"
            sha256 = $hash
            notes = "Категория обновления: $updateCategory. SkyRealm Launcher $version + Game $($gameVersion): verified account session UI; friends, private chat and co-op room invitations; update center with rollback and repair; custom game install folder; FPS cap, separate music and effects volume, remappable keyboard controls and accessibility settings; F12 screenshots with in-launcher gallery; local game calendar and support center with diagnostics report; multi-service status and local performance monitor; cloud world backups; in-app notifications; 41 built-in mods with gameplay effects; external SkyRealmStudio desktop editor with automatic installed-app detection, one-click official download, SHA-256 verification and launch; in-game script editor removed; direct script-mod publishing from SkyRealm Mod Studio with pre-publication validation and launcher-to-game synchronization; public community mod catalog with account-verified ZIP publishing, archive validation, search, categories, downloads and SHA-256 metadata. World favorites and saved mod profiles; progress statistics for playtime, worlds, level and achievements; VSync low-latency Canvas option; sea expedition with animated ocean waves, detailed ship and sailor, visible sharks and underwater creatures, reefs, islands and shipwrecks; repairs missing marine populations in existing sea saves; robust WASD, arrow keys, physical-key-code navigation across keyboard layouts and on-screen hold-to-sail sea controls; account buttons hidden after server-verified login; friend presence (online, away, do not disturb, in-game); expanded six-stage technology progression with physically placed fuel generators, solar panels, batteries, automated mining drills, ore processors, powered shields, turrets, lamps and settlement walls; scheduled night sieges with real monsters spawned around world rifts, live combat tracking for weapon, magic, pet and turret kills, automatic cleanup and save recovery; ancient guardian awakenings with visible map beacons, directional markers and proximity-based combat; five-room Lost Citadel expedition with persistent room progress and rarity-based relic equipment that boosts player damage and defense; expansion progress is stored in each world save; Boss Realm Awakening adds the Ashen Titan, Ice Empress, Mirror of the Abyss and Worldbreaker Colossus raid, four animated arenas with lava and elemental effects, two repeatable guardian trials, ten passive relics, and new world events; four fixed Boss World arenas route major bosses to their assigned arenas; 12 professions (Lumberjack, Miner, Farmer, Hunter, Fisherman, Builder, Crafter, Blacksmith, Alchemist, Cook, Explorer and Technologist) track real actions automatically, with repeatable contracts, career XP, levels, rewards and resource bonuses; Russian and English in-game language selection; and an expanded ordinary world with a stone quarry, an eight-level underground mine with branching galleries, side passages, support beams, breakable resource barrels and cave creatures, deeper mithril/uranium/diamond deposits, pickaxe upgrades, regrowing veins, compost and fertilizer recipes, stonemason ranks, stone sales and delivery contracts; six new mods add bonuses for forestry, farming, crafting, geology, cooking and power generation; both in-game admin and moderator panels add one-click God armor set, Abyss Blade and maximum gear upgrades, including a persistent leggings slot with real damage mitigation; existing accounts and local worlds remain compatible. Adds a dedicated player voting page with server-backed one-account voting, duplicate idea merging and promotion after three different player submissions; includes the live development roadmap, categorized release history and generated posters for major/global updates; Boss Realm tree chopping can awaken the animated, hostile Awakened Tree with glowing eyes, moving root legs, root-snare attacks and a guaranteed Heartwood Core trophy; ordinary-world forests now contain rare animated fruit-bearing trees that yield forest berries when chopped. Adds the Ancient Forest in Boss Realm with rune-marked ancient trees, mineable crystal and stone deposits, the Forest King raid boss awakened after five chopped ancient trees, multi-phase root-wave combat and summoned forest guardians, a unique Heart of the Ancient Forest relic, the Root Crypt guardian trial, a root trap and a cursed treasure chest. Ordinary worlds now include roaming deer, foxes, boars, owls and hares that can be fed berries for rare gifts; the hidden Whispering Cave guardian encounter and treasure; abandoned settlement ambushes; recurring night bandit raids; seasonal snow, leaves and petals; and persistent tree regrowth after three ordinary-world days or five Boss Realm days. Adds the Boss Realm Dimensional Forge with recipes for the Abyss Blade and Tide Trident and artifact evolution using regional materials; the Library of Eternity with four unlockable lore volumes and a persistent explorer atlas; and the Explorer Sanctuary with a healing altar, four-relic trophy museum and collection rewards. These new hubs preserve per-world progress and do not alter player movement. Adds World Chronicles to ordinary worlds with daily resource contracts, six-enemy village defense encounters, five-enemy ancient trail expeditions and persistent rewards; Boss Realm Chronicles track creature kills, ancient tree awakenings, boss and god victories, provide daily trials and allow one daily Rift Warden elite summon. Trade cities now gain a reputation and happiness rank, five civic buildings with real material costs, daily greenhouse supplies and an enemy-spawning defense patrol; the sea adds three discoverable islands with one-time inventory rewards and a three-phase Kraken boss gated by island exploration and ship upgrades. Adds per-settlement trust and wanted levels, village crime consequences, repair and donation actions, fines, trade restrictions and ally rewards saved per world."
            game_version = $gameVersion
            game_download_url = "https://github.com/kisia319-cell/SkyRealm-PC-Launcher/releases/latest/download/SkyRealm_Game.zip"
            game_sha256 = $gameHash
          } | ConvertTo-Json
          Set-Content -Path update_release/manifest.json -Value $manifest -Encoding utf8
          Copy-Item update_release/manifest.json manifest.json -Force

      - name: Reject stale release builds
        shell: pwsh
        run: |
          git fetch origin main
          $builtCommit = "${{ github.sha }}"
          git diff --quiet $builtCommit origin/main -- . ':(exclude)manifest.json' ':(exclude)preview-manifest.json' ':(exclude)tests/**'
          if ($LASTEXITCODE -ne 0) {
            throw "Skipping stale build $builtCommit; source files on main have changed"
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -eq "main" -or $tag -eq "") { $tag = "v" + (Get-Content launcher_version.txt -Raw).Trim() }
          $title = "SkyRealm Launcher $((Get-Content launcher_version.txt -Raw).Trim())"
          $gameVersion = (Get-Content "game/version.txt" -Raw).Trim()
          $releaseManifest = Get-Content "update_release/manifest.json" -Raw | ConvertFrom-Json
          $notes = "Категория обновления: $updateCategory. SkyRealm Launcher $((Get-Content launcher_version.txt -Raw).Trim()) + Game $gameVersion. Includes profile sync, friend requests, private chat, online/away/do-not-disturb/in-game presence, co-op room invitations, saved mod profiles, player statistics, VSync low-latency option, robust keyboard movement, verified login UI, SHA-256 diagnostics and world backup/restore, achievements and cosmetic rewards, searchable world library, adventure history, and external SkyRealmStudio handoff with automatic detection, install prompt, verified download and launch, plus direct validated publication of JavaScript/Python script mods into the game's own mod catalog, and a public community catalog for authenticated mod uploads and downloads. Adds physically placed fuel generators, batteries, automatic mining drills, powered shields, turrets, lamps and stronger settlement walls, scheduled night sieges, ancient guardian events with physical world beacons and proximity-based attacks, a five-room Lost Citadel, rare relic equipment with combat bonuses, and world-save-compatible technology progression; Boss Realm Awakening adds four new bosses, a shield-crystal raid, four animated elemental arenas, repeatable trials and ten legendary relics; fixed arena routing for major bosses; 12 professions with automatically tracked actions, repeatable contracts, career XP, levels and rewards; Russian/English language selection; and an expanded ordinary world with an outdoor quarry, an eight-level underground mine with a branching tunnel network, timber supports, destructible supply barrels and roaming cave creatures, deeper rare ores, pickaxe tiers, regrowing deposits, compost/fertilizer crafting, a stonemason merchant and paid delivery contracts, plus solar power panels and automatic ore processors; admin and moderator panels now include one-click God armor set, Abyss Blade and max gear upgrades with a persistent leggings slot. Existing accounts, worlds and single-player saves remain compatible. Trade cities gain reputation and happiness, five civic buildings with real material costs and combat or income effects, and live enemy defense patrols; the sea gains three named islands with persistent one-time treasure rewards and a three-phase Kraken boss unlocked by exploration and ship upgrades. Adds a dedicated player voting page with server-backed one-account voting, duplicate idea merging and promotion after three different player submissions; includes the live development roadmap, categorized release history and generated posters for major/global updates. Adds the Boss Realm Dimensional Forge with regional crafting recipes and artifact evolution; the Library of Eternity with four unlockable lore volumes and an explorer atlas; and the Explorer Sanctuary with timed full healing, a four-relic trophy museum and persistent collection rewards. Existing saves and movement controls remain unchanged."
          $notes = [string]$releaseManifest.notes
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "Release manifest notes are empty" }
          $notes = [string]$releaseManifest.notes
          $assets = @(
            "dist/SkyRealm.exe",
            "update_release/SkyRealm_Windows.zip",
            "update_release/SkyRealm_Update.zip",
            "update_release/SkyRealm_Game.zip",
            "update_release/manifest.json",
            "update_release/THIRD_PARTY_NOTICES.txt",
            "update_release/ASSET_AND_LICENSE_REGISTER.md",
            "update_release/requirements-build.txt",
            "update_release/build-dependencies.txt"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $title --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          } else {
            gh release edit $tag --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not update release metadata for $tag" }
          }

          # Upload each asset independently. GitHub occasionally returns transient 5xx
          # responses for large files; retry only the failed asset instead of aborting
          # the entire release upload batch.
          foreach ($asset in $assets) {
            $uploaded = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              gh release upload $tag $asset --clobber
              if ($LASTEXITCODE -eq 0) {
                $uploaded = $true
                break
              }
              Write-Warning "Upload failed for $asset (attempt $attempt/5); retrying..."
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $uploaded) { throw "Failed to upload release asset after 5 attempts: $asset" }
          }

          # Verify every expected asset is visible before marking publication complete.
          $releaseJson = gh release view $tag --json assets | ConvertFrom-Json
          $publishedNames = @($releaseJson.assets | ForEach-Object { $_.name })
          foreach ($asset in $assets) {
            $expectedName = [System.IO.Path]::GetFileName($asset)
            if ($publishedNames -notcontains $expectedName) {
              throw "Release asset missing after upload: $expectedName"
            }
          }

      - name: Reject stale manifest publication
        shell: pwsh
        run: |
          git fetch origin main
          $builtCommit = "${{ github.sha }}"
          git diff --quiet $builtCommit origin/main -- . ':(exclude)manifest.json' ':(exclude)preview-manifest.json' ':(exclude)tests/**'
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing stale manifest publication $builtCommit; source files on main have changed"
          }

      - name: Commit updated manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $pushed = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            git fetch origin main
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not fetch main (attempt $attempt/5)"
              Start-Sleep -Seconds (5 * $attempt)
              continue
            }
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw "Could not reset to origin/main" }
            git diff --quiet $builtCommit origin/main -- . ':(exclude)manifest.json' ':(exclude)preview-manifest.json' ':(exclude)tests/**'
            if ($LASTEXITCODE -ne 0) { throw "Source files changed during manifest publication; refusing stale launcher metadata" }
            $builtManifest = Get-Content update_release/manifest.json -Raw | ConvertFrom-Json
            $currentManifest = Get-Content manifest.json -Raw | ConvertFrom-Json
            # This release contains the game archive built from game/ on the same commit.
            # Publish launcher and game metadata together so players always receive the newest game.
            $currentManifest.version = $builtManifest.version
            if ($currentManifest.PSObject.Properties.Name -contains 'category') {
              $currentManifest.category = $builtManifest.category
            } else {
              $currentManifest | Add-Member -NotePropertyName category -NotePropertyValue $builtManifest.category
            }
            $currentManifest.download_url = $builtManifest.download_url
            $currentManifest.sha256 = $builtManifest.sha256
            $currentManifest.game_version = $builtManifest.game_version
            $currentManifest.game_download_url = $builtManifest.game_download_url
            $currentManifest.game_sha256 = $builtManifest.game_sha256
            $currentManifest.notes = $builtManifest.notes
            $currentManifest | ConvertTo-Json -Depth 10 | Set-Content manifest.json -Encoding utf8
            git add manifest.json
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Manifest is already current"
              $pushed = $true
              break
            }
            git commit -m "Update release manifest"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit updated manifest" }
            git push origin main
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            Write-Warning "Push failed (attempt $attempt/5); refreshing main and retrying..."
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $pushed) { throw "Could not publish manifest to main after 5 attempts" }
