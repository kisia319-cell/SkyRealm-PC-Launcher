name: Telegram SkyRealm News

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-skyrealm-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare and publish Telegram news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@SkyRealmGame"
          TELEGRAM_STICKER_ID: ${{ secrets.TELEGRAM_STICKER_ID }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise RuntimeError("TELEGRAM_BOT_TOKEN is not configured; refusing to report a successful publish.")

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          event = os.environ["EVENT_NAME"]
          repo = os.environ["REPOSITORY"]
          head = os.environ["HEAD_SHA"]

          if event == "release":
              title = os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "Новое обновление SkyRealm"
              body = os.environ.get("RELEASE_BODY", "").strip()
              text = (
                  "🚀 <b>Вышло новое обновление SkyRealm!</b>\n\n"
                  f"<b>{html.escape(title)}</b>"
              )
              if body:
                  text += "\n\n" + html.escape(body[:2800])
              tag = os.environ.get("RELEASE_TAG", "")
              if tag:
                  text += f"\n\n<a href=\"https://github.com/{repo}/releases/tag/{html.escape(tag, quote=True)}\">Открыть релиз</a>"
              processed_sha = head
          else:
              # Always classify against the latest main, not an older queued push event.
              subprocess.run(
                  ["git", "fetch", "origin", "+refs/heads/main:refs/remotes/origin/main"],
                  check=True
              )
              head = git("rev-parse", "origin/main")

              state_initialized = False
              try:
                  subprocess.run(
                      ["git", "fetch", "origin", "+refs/heads/telegram-news-state:refs/remotes/origin/telegram-news-state"],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  )
                  base = git("rev-parse", "origin/telegram-news-state")
              except Exception:
                  state_initialized = True
                  try:
                      base = git("rev-parse", f"{head}^")
                  except Exception:
                      base = head

              if base == head:
                  print("No new commits to announce.")
                  sys.exit(0)

              raw = git("log", "--reverse", "--format=%H%x1f%s", f"{base}..{head}")
              commits = []
              for line in raw.splitlines():
                  if "\x1f" in line:
                      sha, subject = line.split("\x1f", 1)
                      commits.append((sha, subject.strip()))

              if not commits:
                  print("No new commits to announce.")
                  sys.exit(0)

              # Ignore release-manifest and news-bot maintenance commits. They are
              # implementation plumbing, not player-facing game updates.
              meta_pattern = re.compile(
                  r"(release manifest|preview manifest|telegram|news.*(threshold|classification|digest)|label detection|weighted update sizes|"
                  r"workflow|readme|documentation|docs:|version bump|test:|tests|smoke coverage|assertion)",
                  re.IGNORECASE
              )
              game_commits = [(sha, subject) for sha, subject in commits if not meta_pattern.search(subject)]

              if not game_commits:
                  subprocess.run(
                      ["git", "push", "--force", "origin", f"{head}:refs/heads/telegram-news-state"],
                      check=True
                  )
                  print("Only repository/release metadata changed; news cursor advanced without a post.")
                  sys.exit(0)

              # Classify actual source changes per commit, not just a narrow set of
          # title keywords. The previous classifier missed verbs such as
          # Enhance/Restore/Polish and ignored code outside the game/ directory.
          major_pattern = re.compile(
              r"(\[major\]|\[big\]|\[large\]|\[важно\]|\[крупн(?:ое|ый)\]|"
              r"^major\s*:|^release\s*:|new world|нов(?:ый|ая) мир|new game mode|нов(?:ый|ая) режим|"
              r"complete rework|полная переработка|новая боевая система|new combat system|"
              r"major expansion|крупное расширение|полная переделка)",
              re.IGNORECASE
          )
          explicit_medium_pattern = re.compile(
              r"(\[medium\]|\[среднее\]|^medium\s*:|^среднее\s*:)",
              re.IGNORECASE
          )
          fix_pattern = re.compile(
              r"fix|bug|исправ|почин|устран|resolve|correct|repair",
              re.IGNORECASE
          )
          minor_pattern = re.compile(
              r"barrel|бочк|animation|анимац|remove|removed|убрал|удалил|tweak|мелк|небольш|"
              r"polish|подправ|баланс|визуал|эффект|частиц|small change|мелкое изменение",
              re.IGNORECASE
          )

          source_extensions = (
              ".js", ".mjs", ".cjs", ".ts", ".tsx", ".jsx", ".html", ".css",
              ".py", ".json", ".xml", ".svg", ".webmanifest"
          )
          ignored_path = re.compile(
              r"(^|/)(test|tests|__tests__|docs|documentation|\.github)(/|$)|"
              r"(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|CHANGELOG|README)",
              re.IGNORECASE
          )

          def commit_source_diff(sha):
              try:
                  output = git("show", "--format=", "--numstat", sha)
              except Exception:
                  return 0, 0
              lines = 0
              files = 0
              for row in output.splitlines():
                  parts = row.split("\t")
                  if len(parts) < 3:
                      continue
                  path = parts[2]
                  if ignored_path.search(path) or not path.lower().endswith(source_extensions):
                      continue
                  try:
                      added = int(parts[0])
                      removed = int(parts[1])
                  except ValueError:
                      continue
                  lines += added + removed
                  files += 1
              return lines, files

          medium_commits = []
          explicit_major_count = 0
          total_source_lines = 0
          total_source_files = 0
          for sha, subject in game_commits:
              changed, files_changed = commit_source_diff(sha)
              total_source_lines += changed
              total_source_files += files_changed
              if major_pattern.search(subject):
                  explicit_major_count += 1
              # A real source-code change to a gameplay commit counts even when
              # its wording is "Enhance", "Restore", "Polish", "Protect", etc.
              if files_changed and changed >= 20:
                  medium_commits.append((sha, subject, changed))
              elif explicit_medium_pattern.search(subject):
                  medium_commits.append((sha, subject, changed))

          medium_total = sum(
              1.5 if explicit_medium_pattern.search(subject) or changed >= 100 else 1.0
              for _, subject, changed in medium_commits
          )
          has_major = (
              explicit_major_count >= 2
              or total_source_lines >= 1200
              or (len(medium_commits) >= 3 and total_source_lines >= 900)
          )
          has_medium = len(medium_commits) >= 3 and not has_major
          if explicit_major_count >= 1 and total_source_lines >= 500:
              has_major = True
              has_medium = False


              fix_commits = [(sha, subject) for sha, subject in game_commits if fix_pattern.search(subject)]
              minor_commits = [
                  (sha, subject) for sha, subject in game_commits
                  if minor_pattern.search(subject) and not fix_pattern.search(subject)
              ]
              small_ready = len(fix_commits) >= 3 and len(minor_commits) >= 1

              if not has_major and not has_medium and not small_ready:
                  print(
                      f"Waiting for more game changes: {len(game_commits)} commits; "
                      f"fixes={len(fix_commits)}, minor changes={len(minor_commits)}, "
                      f"medium score={medium_total:.1f}, game diff={changed_lines} lines."
                  )
                  sys.exit(0)

              if has_major or has_medium:
                  selected = game_commits
              else:
                  selected = sorted(
                      set(fix_commits + minor_commits),
                      key=lambda item: next(i for i, commit in enumerate(game_commits) if commit[0] == item[0])
                  )

              # Process the entire accumulated range. This avoids the old
              # seven-commit window getting stuck behind manifest commits.
              processed_sha = head

              translations = {
                  "add skyrealm combat arts, combos, parry and ultimate": "Добавлены боевые искусства, комбо, парирование и особая способность",
                  "add combat animations, boss phases and weak-point effects": "Добавлены боевые анимации, фазы боссов и эффекты уязвимых мест",
                  "scale biome boss attacks across combat phases": "Улучшены атаки боссов биомов и их боевые фазы",
                  "add visible combat energy hud": "Добавлен индикатор боевой энергии",
                  "upgrade combat ultimate with cinematic slow motion and dynamic camera": "Улучшена особая атака: кинематографическая камера и замедление времени",
                  "refine combat cinematic timing, boss targets and rendering performance": "Улучшены кинематографические эффекты, выбор целей боссов и производительность",
                  "add weapon-specific cinematic impact effects": "Добавлены уникальные эффекты попадания для разных видов оружия",
                  "preserve co-op authority for cinematic ultimate attacks": "Исправлена синхронизация особых атак в совместной игре",
                  "reset transient combat cinematic state with world changes": "Исправлено состояние боевых эффектов при смене мира",
              }

              def russian_news(subject):
                  clean = re.sub(r"^\[(?:medium|среднее|major|важно)\]\s*", "", subject, flags=re.I)
                  clean = re.sub(r"^(?:medium|среднее|major|release|feat|feature)\s*:\s*", "", clean, flags=re.I)
                  key = clean.strip().lower()
                  if key in translations:
                      return translations[key]
                  if re.search(r"boss|босс", key):
                      return "Улучшены боссы: добавлены или доработаны боевые механики"
                  if re.search(r"attack|атак", key):
                      return "Улучшены боевые атаки и их анимации"
                  if re.search(r"mine|cave|шахт|пещер", key):
                      return "Обновлены шахты и пещеры обычного мира"
                  if re.search(r"world|biome|мир|биом", key):
                      return "Обновлены игровые миры и биомы SkyRealm"
                  if re.search(r"fix|bug|исправ|почин", key):
                      return "Исправлены ошибки и улучшена стабильность игры"
                  if re.search(r"add|добав|new|нов", key):
                      return "В SkyRealm добавлены новые игровые возможности"
                  return "Доработаны игровые механики и визуальные эффекты SkyRealm"

              news_items = []
              for _, subject in selected:
                  item = russian_news(subject)
                  if item not in news_items:
                      news_items.append(item)
              lines = "\n".join("▫️ " + html.escape(item) for item in news_items)
              if has_major:
                  heading = "🚀 <b>КРУПНОЕ ОБНОВЛЕНИЕ SKYREALM</b>"
                  intro = "В этом обновлении:"
              elif has_medium:
                  heading = "📦 <b>СРЕДНЕЕ ОБНОВЛЕНИЕ SKYREALM</b>"
                  intro = f"Объединено изменений на {medium_total:.1f} балла:"
              else:
                  heading = "🛠 <b>НЕБОЛЬШИЕ ИЗМЕНЕНИЯ SKYREALM</b>"
                  intro = f"Собрали {len(fix_commits)} исправлений и {len(minor_commits)} небольших игровых изменений:"
              compare = f"https://github.com/{repo}/compare/{base}...{processed_sha}"
              text = f'{heading}\n\n{intro}\n\n{lines}\n\n🔗 <a href="{compare}">Все изменения на GitHub</a>\n\n💚 Спасибо, что следите за SkyRealm!'

          if len(text) > 3900:
              text = text[:3850] + "\n\n…"

          payload = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API rejected the message: " + str(result))

          print("Telegram message published successfully.")

          sticker_id = os.environ.get("TELEGRAM_STICKER_ID", "").strip()
          if sticker_id:
              sticker_payload = json.dumps({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "sticker": sticker_id
              }).encode("utf-8")
              sticker_request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendSticker",
                  data=sticker_payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(sticker_request, timeout=30) as response:
                      sticker_result = json.loads(response.read().decode("utf-8"))
                  if sticker_result.get("ok"):
                      print("Telegram sticker published successfully.")
                  else:
                      print("Sticker was not sent; the news message is already published.")
              except Exception as error:
                  print("Sticker was not sent; the news message is already published:", str(error))
          else:
              print("No TELEGRAM_STICKER_ID configured; decorative emoji are included in the news post.")

          subprocess.run(
              ["git", "push", "--force", "origin", f"{processed_sha}:refs/heads/telegram-news-state"],
              check=True
          )
          print("News cursor updated to " + processed_sha)
          PY
