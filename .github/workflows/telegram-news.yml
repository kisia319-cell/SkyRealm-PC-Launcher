name: Telegram SkyRealm News

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-skyrealm-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare and publish Telegram news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@SkyRealmGame"
          TELEGRAM_STICKER_ID: ${{ secrets.TELEGRAM_STICKER_ID }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise RuntimeError("TELEGRAM_BOT_TOKEN is not configured; refusing to report a successful publish.")

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          event = os.environ["EVENT_NAME"]
          repo = os.environ["REPOSITORY"]
          head = os.environ["HEAD_SHA"]

          if event == "release":
              title = os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "Новое обновление SkyRealm"
              body = os.environ.get("RELEASE_BODY", "").strip()
              text = (
                  "🚀 <b>Вышло новое обновление SkyRealm!</b>\n\n"
                  f"<b>{html.escape(title)}</b>"
              )
              if body:
                  text += "\n\n" + html.escape(body[:2800])
              tag = os.environ.get("RELEASE_TAG", "")
              if tag:
                  text += f"\n\n<a href=\"https://github.com/{repo}/releases/tag/{html.escape(tag, quote=True)}\">Открыть релиз</a>"
              processed_sha = head
          else:
              state_initialized = False
              try:
                  subprocess.run(
                      ["git", "fetch", "origin", "telegram-news-state:refs/remotes/origin/telegram-news-state"],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  )
                  base = git("rev-parse", "origin/telegram-news-state")
              except Exception:
                  state_initialized = True
                  try:
                      base = git("rev-parse", f"{head}^")
                  except Exception:
                      base = head

              if base == head:
                  if state_initialized:
                      subprocess.run(
                          ["git", "push", "--force", "origin", f"{base}:refs/heads/telegram-news-state"],
                          check=True
                      )
                  print("No new commits to announce.")
                  sys.exit(0)

              raw = git("log", "--reverse", "--format=%H%x1f%s", f"{base}..{head}")
              commits = []
              for line in raw.splitlines():
                  if "\x1f" in line:
                      sha, subject = line.split("\x1f", 1)
                      commits.append((sha, subject.strip()))

              if not commits:
                  print("No new commits to announce.")
                  sys.exit(0)

              # Major = explicitly announced release or genuinely large gameplay expansion.
              major_pattern = re.compile(
                  r"(\[major\]|\[важно\]|^major\s*:|^release\s*:|new world|нов(?:ый|ая) мир|new game mode|нов(?:ый|ая) режим|complete rework|полная переработка|новая боевая система)",
                  re.IGNORECASE
              )
              has_major = any(major_pattern.search(subject) for _, subject in commits)

              batch = commits[:7]
              explicit_medium_pattern = re.compile(
                  r"(\[medium\]|\[среднее\]|^medium\s*:|^среднее\s*:)",
                  re.IGNORECASE
              )
              boss_number_pattern = re.compile(
                  r"\b(\d+)\s*(?:boss(?:es)?|босс(?:а|ов|ы)?)\b|"
                  r"\b(?:four|четыре)\s+(?:boss(?:es)?|босс(?:а|ов|ы)?)\b",
                  re.IGNORECASE
              )
              attack_pattern = re.compile(r"attack|атак", re.IGNORECASE)

              def medium_weight(subject):
                  if explicit_medium_pattern.search(subject):
                      return 1.0
                  boss_match = boss_number_pattern.search(subject)
                  if boss_match and attack_pattern.search(subject):
                      count_text = boss_match.group(1)
                      boss_count = int(count_text) if count_text else 4
                      if boss_count >= 4:
                          return 1.5
                      if boss_count >= 2:
                          return 1.0
                      return 0.5
                  return 0.0

              medium_total = sum(medium_weight(subject) for _, subject in batch)
              # Several medium-sized changes together form a major release.
              if medium_total >= 4.0:
                  has_major = True
              has_medium = medium_total >= 2.0 and not has_major

              fix_pattern = re.compile(r"fix|bug| исправ|исправлен|почин|устран", re.IGNORECASE)
              minor_change_pattern = re.compile(
                  r"barrel|бочк|animation|анимац|remove|removed|убрал|удалил|tweak|мелк|небольш|"
                  r"polish|подправ|баланс|визуал|эффект|частиц|мелкое изменение|add|добав|change|измен|update|обнов",
                  re.IGNORECASE
              )
              fix_commits = [(sha, subject) for sha, subject in batch if fix_pattern.search(subject)]
              minor_commits = [(sha, subject) for sha, subject in batch if minor_change_pattern.search(subject)]
              small_ready = len(fix_commits) >= 3 and len(minor_commits) >= 1

              if not has_major and not has_medium and not small_ready:
                  if state_initialized:
                      subprocess.run(
                          ["git", "push", "--force", "origin", f"{base}:refs/heads/telegram-news-state"],
                          check=True
                      )
                      print("Initialized the news cursor at " + base)
                  print(
                      f"Collected {len(commits)} commits; fixes={len(fix_commits)}, "
                      f"minor gameplay changes={len(minor_commits)}, medium weight={medium_total:.1f}; waiting."
                  )
                  sys.exit(0)

              if has_major:
                  selected = commits
                  processed_sha = selected[-1][0]
              elif has_medium:
                  selected = batch
                  processed_sha = selected[-1][0]
              else:
                  # A small digest contains only fixes and minor gameplay changes.
                  selected = sorted(set(fix_commits + minor_commits), key=lambda item: batch.index(item))
                  processed_sha = batch[-1][0]
              translations = {
                  "update release manifest": "Обновлена информация о версии и составе релиза",
                  "add medium-update telegram publishing threshold": "Улучшена система новостей: два средних обновления теперь объединяются в один выпуск",
                  "add animated telegraphed attacks for surface biome bosses": "Боссам поверхностных биомов добавлены новые атаки с предупреждающей анимацией",
                  "fix biome boss attack windup resolution": "Исправлена подготовка и своевременный запуск атак боссов биомов",
              }

              def russian_news(subject):
                  clean = re.sub(r"^\[(?:medium|среднее|major|важно)\]\s*", "", subject, flags=re.I)
                  clean = re.sub(r"^(?:medium|среднее|major|release|feat|feature)\s*:\s*", "", clean, flags=re.I)
                  key = clean.strip().lower()
                  if key in translations:
                      return translations[key]
                  if re.search(r"boss|босс", key):
                      return "Улучшены боссы: добавлены или исправлены боевые механики"
                  if re.search(r"attack|атак", key):
                      return "Улучшены боевые атаки и их анимации"
                  if re.search(r"mine|cave|шахт|пещер", key):
                      return "Обновлены шахты и пещеры обычного мира"
                  if re.search(r"world|biome|мир|биом", key):
                      return "Обновлены миры и биомы SkyRealm"
                  if re.search(r"fix|bug|исправ", key):
                      return "Исправлены ошибки и улучшена стабильность игры"
                  if re.search(r"add|добав", key):
                      return "В SkyRealm добавлены новые возможности"
                  return "Внесены улучшения в игру и систему разработки SkyRealm"

              news_items = []
              for _, subject in selected:
                  item = russian_news(subject)
                  if item not in news_items:
                      news_items.append(item)
              lines = "\n".join("▫️ " + html.escape(item) for item in news_items)
              if has_major:
                  heading = "🚀 <b>КРУПНОЕ ОБНОВЛЕНИЕ SKYREALM</b>"
                  intro = "В этом обновлении:"
              elif has_medium:
                  heading = "📦 <b>СРЕДНЕЕ ОБНОВЛЕНИЕ SKYREALM</b>"
                  intro = f"Набралось {medium_total:.1f} балла по масштабу изменений:"
              else:
                  heading = "🛠 <b>НЕБОЛЬШИЕ ИЗМЕНЕНИЯ SKYREALM</b>"
                  intro = f"Собрали {len(fix_commits)} исправлений и {len(minor_commits)} небольших игровых изменений:"
              compare = f"https://github.com/{repo}/compare/{base}...{processed_sha}"
              text = f"{heading}\n\n{intro}\n\n{lines}\n\n🔗 <a href=\"{compare}\">Все изменения на GitHub</a>\n\n💚 Спасибо, что следите за SkyRealm!"

          if len(text) > 3900:
              text = text[:3850] + "\n\n…"

          payload = json.dumps({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API rejected the message: " + str(result))

          print("Telegram message published successfully.")

          sticker_id = os.environ.get("TELEGRAM_STICKER_ID", "").strip()
          if sticker_id:
              sticker_payload = json.dumps({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "sticker": sticker_id
              }).encode("utf-8")
              sticker_request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendSticker",
                  data=sticker_payload,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(sticker_request, timeout=30) as response:
                      sticker_result = json.loads(response.read().decode("utf-8"))
                  if sticker_result.get("ok"):
                      print("Telegram sticker published successfully.")
                  else:
                      print("Sticker was not sent; the news message is already published.")
              except Exception as error:
                  print("Sticker was not sent; the news message is already published:", str(error))
          else:
              print("No TELEGRAM_STICKER_ID configured; decorative emoji are included in the news post.")

          subprocess.run(
              ["git", "push", "--force", "origin", f"{processed_sha}:refs/heads/telegram-news-state"],
              check=True
          )
          print("News cursor updated to " + processed_sha)
          PY
