name: Telegram SkyRealm News

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-skyrealm-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare and publish Telegram news
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@SkyRealmGame"
          EVENT_NAME: \${{ github.event_name }}
          HEAD_SHA: \${{ github.sha }}
          RELEASE_NAME: \${{ github.event.release.name }}
          RELEASE_BODY: \${{ github.event.release.body }}
          RELEASE_TAG: \${{ github.event.release.tag_name }}
          REPOSITORY: \${{ github.repository }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise RuntimeError("TELEGRAM_BOT_TOKEN is not configured.")

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          event = os.environ["EVENT_NAME"]
          repo = os.environ["REPOSITORY"]
          head = os.environ["HEAD_SHA"]
          message = ""

          if event == "release":
              title = os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "Новое обновление SkyRealm"
              body = os.environ.get("RELEASE_BODY", "").strip()
              message = "🚀 <b>Вышло новое обновление SkyRealm!</b>\n\n<b>" + html.escape(title) + "</b>"
              if body:
                  message += "\n\n" + html.escape(body[:2800])
              tag = os.environ.get("RELEASE_TAG", "")
              if tag:
                  message += '\n\n<a href="https://github.com/' + repo + '/releases/tag/' + html.escape(tag, quote=True) + '">Открыть релиз</a>'
              processed_sha = head
          else:
              subprocess.run(["git", "fetch", "origin", "+refs/heads/main:refs/remotes/origin/main"], check=True)
              head = git("rev-parse", "origin/main")
              try:
                  subprocess.run(
                      ["git", "fetch", "origin", "+refs/heads/telegram-news-state:refs/remotes/origin/telegram-news-state"],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  )
                  base = git("rev-parse", "origin/telegram-news-state")
              except Exception:
                  try:
                      base = git("rev-parse", head + "^")
                  except Exception:
                      base = head

              if base == head:
                  print("No new commits to announce.")
                  sys.exit(0)

              raw = git("log", "--reverse", "--format=%H%x1f%s", base + ".." + head)
              commits = []
              for line in raw.splitlines():
                  if "\x1f" in line:
                      sha, subject = line.split("\x1f", 1)
                      commits.append((sha, subject.strip()))

              meta = re.compile(
                  r"(release manifest|preview manifest|telegram|news.*(threshold|classification|digest)|"
                  r"workflow|readme|documentation|docs:|version bump|test:|tests|smoke coverage|assertion)",
                  re.I
              )
              game_commits = [(sha, subject) for sha, subject in commits if not meta.search(subject)]
              if not game_commits:
                  subprocess.run(["git", "push", "--force", "origin", head + ":refs/heads/telegram-news-state"], check=True)
                  print("Only metadata changed; cursor advanced without a post.")
                  sys.exit(0)

              source_ext = (".js", ".mjs", ".cjs", ".ts", ".tsx", ".jsx", ".html", ".css", ".py", ".json", ".xml", ".svg")
              ignored = re.compile(r"(^|/)(test|tests|__tests__|docs|documentation|\.github)(/|$)|"
                                   r"(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|CHANGELOG|README)", re.I)

              def source_diff(sha):
                  output = git("show", "--format=", "--numstat", sha)
                  changed = files = 0
                  for row in output.splitlines():
                      parts = row.split("\t")
                      if len(parts) < 3 or ignored.search(parts[2]) or not parts[2].lower().endswith(source_ext):
                          continue
                      try:
                          changed += int(parts[0]) + int(parts[1])
                          files += 1
                      except ValueError:
                          pass
                  return changed, files

              major_re = re.compile(
                  r"(\[major\]|\[big\]|\[large\]|\[важно\]|\[крупн(?:ое|ый)\]|^major\s*:|^release\s*:|"
                  r"new world|нов(?:ый|ая) мир|new game mode|нов(?:ый|ая) режим|complete rework|"
                  r"полная переработка|новая боевая система|new combat system|major expansion|крупное расширение)",
                  re.I
              )
              medium_re = re.compile(r"(\[medium\]|\[среднее\]|^medium\s*:|^среднее\s*:)", re.I)
              fix_re = re.compile(r"fix|bug|исправ|почин|устран|resolve|correct|repair", re.I)
              minor_re = re.compile(r"barrel|бочк|animation|анимац|remove|removed|убрал|удалил|tweak|мелк|"
                                    r"небольш|polish|подправ|баланс|визуал|эффект|частиц|small change", re.I)

              medium_commits = []
              major_count = 0
              total_lines = 0
              for sha, subject in game_commits:
                  changed, file_count = source_diff(sha)
                  total_lines += changed
                  if major_re.search(subject):
                      major_count += 1
                  if file_count and changed >= 20 or medium_re.search(subject):
                      medium_commits.append((sha, subject, changed))

              medium_score = sum(1.5 if medium_re.search(s) or n >= 100 else 1.0 for _, s, n in medium_commits)
              is_major = major_count >= 2 or total_lines >= 1200 or (len(medium_commits) >= 3 and total_lines >= 900)
              if major_count >= 1 and total_lines >= 500:
                  is_major = True
              is_medium = len(medium_commits) >= 3 and not is_major

              fixes = [(s, t) for s, t in game_commits if fix_re.search(t)]
              minors = [(s, t) for s, t in game_commits if minor_re.search(t) and not fix_re.search(t)]
              is_small = len(fixes) >= 3 and len(minors) >= 1

              if not (is_major or is_medium or is_small):
                  print("Waiting for more updates: commits=" + str(len(game_commits)) +
                        ", medium=" + str(len(medium_commits)) + ", fixes=" + str(len(fixes)) +
                        ", minor=" + str(len(minors)) + ", source_lines=" + str(total_lines))
                  sys.exit(0)

              selected = game_commits if is_major or is_medium else sorted(
                  set(fixes + minors),
                  key=lambda item: next(i for i, commit in enumerate(game_commits) if commit[0] == item[0])
              )

              translations = {
                  "add skyrealm combat arts, combos, parry and ultimate": "Добавлены боевые искусства, комбо, парирование и особая способность",
                  "add combat animations, boss phases and weak-point effects": "Добавлены боевые анимации, фазы боссов и эффекты уязвимых мест",
                  "scale biome boss attacks across combat phases": "Улучшены атаки боссов биомов и их боевые фазы",
                  "add visible combat energy hud": "Добавлен индикатор боевой энергии",
                  "upgrade combat ultimate with cinematic slow motion and dynamic camera": "Улучшена особая атака: кинематографическая камера и замедление времени",
                  "refine combat cinematic timing, boss targets and rendering performance": "Улучшены кинематографические эффекты, выбор целей боссов и производительность",
                  "add weapon-specific cinematic impact effects": "Добавлены уникальные эффекты попадания для разных видов оружия"
              }

              def russian_news(subject):
                  clean = re.sub(r"^(\[(?:medium|среднее|major|важно)\]\s*|(?:medium|среднее|major|release|feat|feature)\s*:\s*)", "", subject, flags=re.I)
                  key = clean.lower().strip()
                  if key in translations:
                      return translations[key]
                  if re.search(r"boss|босс", key):
                      return "Улучшены боссы и их боевые механики"
                  if re.search(r"attack|атак", key):
                      return "Улучшены боевые атаки и анимации"
                  if re.search(r"mine|cave|шахт|пещер", key):
                      return "Обновлены шахты и пещеры обычного мира"
                  if re.search(r"sea|ocean|море|океан|кораб", key):
                      return "Доработаны морской мир и морские приключения"
                  if re.search(r"world|biome|мир|биом", key):
                      return "Обновлены игровые миры и биомы SkyRealm"
                  if re.search(r"fix|bug|исправ|почин", key):
                      return "Исправлены ошибки и улучшена стабильность игры"
                  if re.search(r"add|добав|new|нов", key):
                      return "В SkyRealm добавлены новые игровые возможности"
                  return "Доработаны игровые механики и визуальные эффекты SkyRealm"

              items = []
              for _, subject in selected:
                  item = russian_news(subject)
                  if item not in items:
                      items.append(item)
              bullets = "\n".join("▫️ " + html.escape(item) for item in items)
              if is_major:
                  heading, intro = "🚀 <b>КРУПНОЕ ОБНОВЛЕНИЕ SKYREALM</b>", "В этом обновлении:"
              elif is_medium:
                  heading, intro = "📦 <b>СРЕДНЕЕ ОБНОВЛЕНИЕ SKYREALM</b>", "Объединено изменений на " + str(round(medium_score, 1)) + " балла:"
              else:
                  heading, intro = "🛠 <b>НЕБОЛЬШИЕ ИЗМЕНЕНИЯ SKYREALM</b>", "Собрали " + str(len(fixes)) + " исправлений и " + str(len(minors)) + " небольших игровых изменений:"
              processed_sha = head
              compare = "https://github.com/" + repo + "/compare/" + base + "..." + processed_sha
              message = heading + "\n\n" + intro + "\n\n" + bullets + '\n\n🔗 <a href="' + compare + '">Все изменения на GitHub</a>\n\n💚 Спасибо, что следите за SkyRealm!'

          if not message:
              raise RuntimeError("Generated Telegram message is empty.")
          if len(message) > 3900:
              message = message[:3850] + "\n\n…"

          payload = json.dumps({
              "chat_id": os.environ.get("TELEGRAM_CHAT_ID", "@SkyRealmGame"),
              "text": message,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.telegram.org/bot" + token + "/sendMessage",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              raise RuntimeError("Telegram sendMessage failed (HTTP " + str(error.code) + "): " + details) from error
          if not result.get("ok"):
              raise RuntimeError("Telegram API rejected the message: " + str(result))

          print("Telegram message published successfully.")
          subprocess.run(["git", "push", "--force", "origin", processed_sha + ":refs/heads/telegram-news-state"], check=True)
          print("News cursor updated to " + processed_sha)
          PY
