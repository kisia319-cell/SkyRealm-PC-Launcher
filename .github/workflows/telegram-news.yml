name: Telegram SkyRealm News

on:
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-skyrealm-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish commit-aware Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@SkyRealmGame"
          REPOSITORY: ${{ github.repository }}
        run: python scripts/telegram_news.py
